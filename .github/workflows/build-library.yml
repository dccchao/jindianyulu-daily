name: Build reading library
on:
  push:
    branches: [main]
    paths:
      - 'reading/**'
      - 'reviews/**'
      - 'publisher/**'
      - 'seed-books.json'
      - 'books/**'
      - 'index.html'
      - 'quotes.json'
      - '.github/workflows/build-library.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: reading-library
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test shared body rules and build converter
        run: bash publisher/gradlew -p publisher test jar --console=plain
      - name: Generate all books before publishing
        run: java -jar publisher/build/libs/reading-publisher.jar .
      - name: Save generated library to repository
        if: github.event_name != 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A books.json books quotes.json seed-books.json
          if ! git diff --cached --quiet; then
            git commit -m "Update generated reading library [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - name: Prepare public site
        run: |
          mkdir -p _site/books
          cp index.html quotes.json books.json _site/
          find books -maxdepth 1 -name '*.json' -type f -exec cp {} _site/books/ \;
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
